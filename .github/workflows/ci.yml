name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Real Postgres for the Prisma drift check below. The build itself
      # never connects (uses the placeholder DATABASE_URL), so this only
      # matters for `prisma migrate diff --shadow-database-url`.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: _drift_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Placeholder DATABASE_URL so `prisma generate` and `next build` don't
      # fail on missing config. CI does not connect to a real DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/etracker?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-must-be-32-chars-long
      NEXTAUTH_URL: http://localhost:3000
      # Disable telemetry to keep CI logs clean.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Detect schema/migrations drift
        env:
          # Prisma v7 reads the shadow DB URL from `prisma.config.ts`
          # (`datasource.shadowDatabaseUrl`), which forwards this env var.
          # The `--shadow-database-url` CLI flag was removed in v7.
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/_drift_check
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code || (echo "::error::Schema drift detected — generate a migration with 'npx prisma migrate dev --name <change>'" && exit 1)
