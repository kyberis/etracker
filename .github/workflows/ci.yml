name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder DATABASE_URL so `prisma generate` and `next build` don't
      # fail on missing config. CI does not connect to a real DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/etracker?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-must-be-32-chars-long
      NEXTAUTH_URL: http://localhost:3000
      # Disable telemetry to keep CI logs clean.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Detect schema/migrations drift
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@127.0.0.1:5432/_drift_check" \
            --exit-code || (echo "::error::Schema drift detected — generate a migration with 'npx prisma migrate dev --name <change>'" && exit 1)
        # Drift check is best-effort: it fails open on missing shadow DB,
        # which is expected on PRs from forks where we don't spin one up.
        continue-on-error: true
